<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View digital photo book powered by Google Drive.">
  <title>Photo Book — Folio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="photobook-body">
  <!-- ─── Photobook Minimal Header ─── -->
  <header id="book-header">
    <div class="book-title-group">
      <span class="book-mark">◈</span>
      <h1 id="book-heading">Photo Book</h1>
      <span id="book-count" class="badge">Loading…</span>
    </div>

    <div class="book-controls">
      <label for="col-slider" id="col-label">Columns</label>
      <input id="col-slider" type="range" min="2" max="6" value="4" aria-label="Number of columns">
      <button id="btn-sort" class="icon-btn" aria-label="Toggle sort order" title="Toggle sort order">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 5 6 1 1 5"/><line x1="6" y1="1" x2="6" y2="17"/><polyline points="13 19 18 23 23 19"/><line x1="18" y1="23" x2="18" y2="7"/></svg>
      </button>
      <button id="btn-fullscreen" class="icon-btn" aria-label="Toggle fullscreen" title="Toggle fullscreen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </header>

  <!-- ─── Loading State ─── -->
  <section id="loading-state" aria-live="polite">
    <div id="loader-ring"></div>
    <p id="loading-text">Opening photo book…</p>
  </section>

  <!-- ─── Gallery ─── -->
  <main id="book-main">
    <section id="gallery-section" hidden aria-label="Photo gallery">
      <div id="masonry-grid" role="list" aria-label="Photo gallery"></div>
    </section>
  </main>

  <!-- ─── Lightbox ─── -->
  <dialog id="lightbox" aria-label="Photo viewer">
    <button id="lb-close" class="lb-btn" aria-label="Close viewer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button id="lb-prev" class="lb-btn lb-nav" aria-label="Previous photo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <figure id="lb-figure">
      <img id="lb-img" alt="">
      <figcaption id="lb-caption"></figcaption>
    </figure>
    <button id="lb-next" class="lb-btn lb-nav" aria-label="Next photo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <p id="lb-counter"></p>
  </dialog>

  <!-- ─── Shared Folder Auth Prompt Modal ─── -->
  <dialog id="auth-prompt-modal" class="auth-modal" aria-labelledby="auth-modal-title">
    <header class="auth-modal-header">
      <h2 id="auth-modal-title">Sign in to View Photos</h2>
    </header>
    <p id="auth-modal-desc">Google Drive requires visitors to sign in to access folders shared via link. Click below to sign in with your Google account and open this photo book.</p>
    <button id="btn-modal-signin" class="btn-primary">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.76h3.56c2.08-1.92 3.28-4.74 3.28-8.09z" fill="var(--clr-accent)"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.76c-.98.66-2.23 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="var(--clr-success)"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="var(--clr-warning)"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="var(--clr-error)"/></svg>
      Sign in with Google
    </button>
  </dialog>

  <!-- ─── Toast ─── -->
  <output id="toast" role="status" aria-live="polite"></output>

  <script src="js/config.js" onerror="/* config.js gitignored */"></script>
  <script>
    if (typeof FOLIO_CONFIG === 'undefined') {
      window.FOLIO_CONFIG = Object.freeze({
        CLIENT_ID: '545626497983-nm2fee24h4ntsne4av1kl00f7id9g496.apps.googleusercontent.com',
        API_KEY: localStorage.getItem('folio_api_key') || '',
        APPS_SCRIPT_URL: localStorage.getItem('folio_apps_script_url') || '',
        SCOPES: 'https://www.googleapis.com/auth/drive.readonly',
        DISCOVERY_DOC: 'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest',
        IMAGE_MIMES: [
          'image/jpeg', 'image/png', 'image/gif', 'image/webp',
          'image/bmp', 'image/svg+xml', 'image/heic', 'image/heif'
        ],
        PAGE_SIZE: 100,
      });
    }
  </script>
  <script src="js/auth.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/book.js"></script>
</body>
</html>
